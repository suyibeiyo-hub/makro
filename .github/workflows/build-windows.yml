name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MakroScraper makro_scraper.py

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path dist/MakroScraper.exe -DestinationPath dist/MakroScraper-windows.zip -Force

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MakroScraper-windows
          path: |
            dist/MakroScraper.exe
            dist/MakroScraper-windows.zip
          if-no-files-found: error
